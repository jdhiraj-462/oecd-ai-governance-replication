- number: Figure 1
  file: Figure1_similarity_heatmap
  caption: 'Similarity of national AI policy portfolios. Each cell is the cosine similarity between two jurisdictions'' topic profiles; darker cells are more similar. Rows and columns follow the clustering in Figure 2. India, the European Union, and the United States are shown in bold. Source: Authors'' analysis of the OECD.AI Policy Navigator.'
  alt: Heat map of pairwise similarity between the AI policy topic profiles of each jurisdiction in the study, with India, the European Union and the United States highlighted.
  extended: A square grid with one row and one column for each of the [[N_CLUSTERED]] jurisdictions included in the clustering. Cell shading runs from very light blue for low similarity to dark blue for a similarity of one. The colour bar on the right is labelled Cosine similarity of topic profiles. Jurisdiction names appear along the left side and along the bottom. India, European Union and United States are printed in bold. The cosine similarity of India with the European Union institutions is [[COS_EU]] and with the United States is [[COS_US]].
- number: Figure 2
  file: Figure2_dendrogram
  caption: 'Clustering of jurisdictions by the topic profiles of their AI policy initiatives. Average-linkage hierarchical clustering on Jensen-Shannon distance. Source: Authors'' analysis of the OECD.AI Policy Navigator.'
  alt: Tree diagram grouping jurisdictions by how similar their AI policy topic profiles are, with India, the European Union and the United States highlighted.
  extended: A horizontal tree diagram. Jurisdiction names are listed down the left side and branches join them from right to left. The horizontal axis is labelled Jensen Shannon distance, average linkage. Jurisdictions joined by short branches have similar portfolios. The silhouette criterion selected [[BEST_K]] clusters. India is grouped with [[INDIA_PEERS]]. Jurisdictions that share India's cluster in at least 70 percent of bootstrap re-clusterings are [[STABLE_PEERS]].
- number: Figure 3
  file: Figure3_india_gaps
  caption: 'Theme-level differences between India and three benchmarks. Points show the benchmark''s share of initiatives on a theme minus India''s share; bars are 95 percent intervals from a cluster bootstrap with Jeffreys-prior smoothing. Positive values mean India gives the theme less weight. Asterisks mark differences significant after Benjamini-Hochberg correction at a false discovery rate of 0.10 within each benchmark. Source: Authors'' analysis of the OECD.AI Policy Navigator.'
  alt: Dot plot of the difference between benchmark and Indian topic shares, with intervals, for each policy theme, against the EU, the US and the non-OECD mean.
  extended: 'Each row is one policy theme, labelled on the left. For each theme there are up to three markers with horizontal interval bars: a blue circle for the comparison with the European Union institutions, an orange square for the United States, and a green diamond for the mean of non-OECD jurisdictions. A vertical grey line marks zero. The horizontal axis is labelled Benchmark share minus India share, positive equals India gives the theme less weight. A legend in the lower right names the three benchmarks. Asterisks appear beside intervals that are significant after correction. [[GAP_TEXT]]'
- number: Figure 4
  file: Figure4_instrument_mix
  caption: 'Policy instrument mix by Hood and Margetts'' tools of government. Bars show the share of each unit''s initiatives coded to each tool. Source: Authors'' coding of the OECD.AI Policy Navigator.'
  alt: Grouped bar chart comparing the share of initiatives using authority, treasure, nodality and organization tools for India, the EU, the US and non-OECD jurisdictions.
  extended: 'Groups of bars labelled Authority, Treasure, Nodality, Organization and, if present, Unclassified along the horizontal axis. Each group has four bars: dark grey for India, blue for the European Union institutions, orange for the United States and green for non-OECD jurisdictions pooled, as shown in the legend at the top right. The vertical axis is labelled Share of unit''s initiatives and runs in percent. Each bar carries its percentage value above it. [[E2_TEXT]]'
