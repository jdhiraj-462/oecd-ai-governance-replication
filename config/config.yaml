# Analysis configuration. Every number that shapes a result lives here,
# so a reviewer can see and change it without reading the code.

paths:
  raw: data/raw/oecd_ai_policy_navigator.csv   # the export you download (CSV, XLSX or JSON)
  processed: data/processed
  topic_labels: config/topic_labels.csv   # authors fill 'label' and 'role' after the first run
  results: results

# Column names differ between OECD.AI export versions. The loader tries each
# alias in order and uses the first one present. Add aliases if your export differs.
columns:
  id:            [slug, id, initiative_id, "Initiative ID", ID, url, URL, link]
  title:         [title, name, "Name", "Initiative name", "Title", "English name"]
  description:   [description, overview, "Initiative overview", "Description", "Summary", "Overview"]
  objectives:    [objectives, "Objectives", "Objective(s)", "Policy objectives", "Background"]
  jurisdiction:  [country, jurisdiction, "Country", "Jurisdiction", "Country/territory", "Countries", "Organisation country", "Country/Organisation", "Country/Territory of origin"]
  category:      [category, "Category", "Policy category"]
  instrument:    [initiative_type, instrument, "Initiative type", "Policy instrument", "Instrument type", "Type"]
  binding:       [binding, "Binding", "Legally binding"]
  status:        [status, "Status"]
  start_year:    [start_year, "Start Year", "Start year", "Start date", "Year"]
  target_sectors: [target_sectors, "Target Sectors", "Target sectors", "Sector"]
  oecd_principles: [oecd_principles, "OECD AI Principles", "AI principles"]
  organisation:  [organisation, organization, "Organisation", "Responsible organisation", "Lead organisation"]

sample:
  # Jurisdictions kept as analytic units. "European Union" covers EU-level initiatives
  # (Commission, Parliament, Council). EU member states stay separate units.
  eu_label: "European Union"
  india_label: "India"
  us_label: "United States"
  exclude_subnational: true          # drop entries flagged "(Subnational: ...)"
  exclude_international_orgs: true   # drop OECD, UNESCO, G7, etc.
  min_chars: 120                     # minimum text length after cleaning
  min_initiatives_per_country: 10    # countries below this are excluded from clustering
  english_only: true

text:
  mask_geography: true   # replace place names, nationalities, languages, currencies by PLACE (see src/govtopics/mask.py)
  extra_stopwords: [place, ai, artificial, intelligence, initiative, policy, programme, program,
                    government, national, strategy, also, including, well, aims, aim,
                    new, use, support, develop, development]
  ngram_range: [1, 2]
  min_df: 3
  max_df: 0.85

bertopic:
  embedding_model: all-mpnet-base-v2
  umap: {n_neighbors: 15, n_components: 5, min_dist: 0.0, metric: cosine}
  hdbscan: {min_cluster_size: 12, min_samples: 5, metric: euclidean, cluster_selection_method: eom}
  # BERTopic fits its vectorizer on ONE concatenated document per topic, so
  # min_df/max_df here count topics, not initiatives. min_df > 1 would delete
  # exactly the terms that make a topic distinctive.
  vectorizer: {min_df: 1, max_df: 1.0}
  reduce_outliers: true      # reassign HDBSCAN outliers by c-TF-IDF similarity
  seeds: [11, 23, 42, 57, 89] # stability is reported across these seeds
  primary_seed: 42

lda:
  k_grid: [8, 10, 12, 15, 18, 20, 25, 30]
  passes: 30
  iterations: 400
  seeds: [11, 23, 42]
  primary_seed: 42
  alpha: auto
  eta: auto

similarity:
  bootstrap_reps: 2000
  permutation_reps: 5000
  ci: 0.95
  smoothing: 0.5   # additive (Laplace) smoothing on country-topic counts before normalising

clustering:
  method: average        # average linkage on Jensen-Shannon distance
  k_range: [2, 3, 4, 5, 6, 7, 8]

# Units India is compared with. EU27_POOLED = EU institutions + member states;
# NON_OECD_POOLED = all non-OECD jurisdictions pooled (India excluded).
comparators: [European Union, EU27_POOLED, United States, NON_OECD_POOLED]

# OECD membership: 38 members (Costa Rica, 2021, the latest), checked 21 Nov 2026 at
# https://www.oecd.org/en/about/members-partners.html . EU-27 membership as of 2026.
groups:
  oecd_members: [Australia, Austria, Belgium, Canada, Chile, Colombia, Costa Rica, Czechia, Denmark,
                 Estonia, Finland, France, Germany, Greece, Hungary, Iceland, Ireland, Israel, Italy,
                 Japan, Korea, Latvia, Lithuania, Luxembourg, Mexico, Netherlands, New Zealand, Norway,
                 Poland, Portugal, Slovakia, Slovenia, Spain, Sweden, Switzerland, Türkiye,
                 United Kingdom, United States]
  eu27_members: [Austria, Belgium, Bulgaria, Croatia, Cyprus, Czechia, Denmark, Estonia, Finland, France,
                 Germany, Greece, Hungary, Ireland, Italy, Latvia, Lithuania, Luxembourg, Malta,
                 Netherlands, Poland, Portugal, Romania, Slovakia, Slovenia, Spain, Sweden]

# The cluster bootstrap resamples whole responsible organisations when that field exists.
bootstrap_cluster_field: organisation

gaps:
  benchmarks: [European Union, EU27_POOLED, United States, GLOBAL_MEAN, NON_OECD_MEAN]
  min_benchmark_share: 0.02  # ignore topics the benchmark itself barely covers
  fdr_q: 0.10                # Benjamini-Hochberg false discovery rate for gap flags

validation:
  sample_size: 200
  instrument_sample_size: 150
  intrusion_tasks_per_topic: 3
  seed: 2026
